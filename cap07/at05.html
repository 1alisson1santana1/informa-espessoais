<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PWEB1 — Cap. 07 — AT05 — Mini Design System</title>

  <link rel="stylesheet" href="at05-style.css" />
</head>

<body>

  <section class="hero">

    <div class="hero__conteudo">

      <h1 class="hero__titulo">
        Nebula UI
      </h1>

      <p class="hero__subtitulo">
        Um mini design system moderno desenvolvido com HTML e CSS.
      </p>

      <button class="btn btn--primario hero__cta">
        Explorar Componentes
      </button>

    </div>

  </section>

  <main class="container">

    <section class="secao">

      <h2>Botões</h2>

      <div class="grupo-botoes">

        <button class="btn btn--primario">
          Ação principal
        </button>

        <button class="btn btn--secundario">
          Ação secundária
        </button>

        <button class="btn btn--perigo">
          Ação destrutiva
        </button>

        <button class="btn btn--primario" disabled>
          Desabilitado
        </button>

      </div>

    </section>

    <section class="secao">

      <h2>Card de Destaque</h2>

      <article class="card">

        <span class="card__badge">
          Destaque
        </span>

        <div class="card__imagem"></div>

        <div class="card__corpo">

          <h3 class="card__titulo">
            Título do card
          </h3>

          <p class="card__texto">
            Descrição do conteúdo do card.
          </p>

          <a class="card__link" href="#">
            Saiba mais →
          </a>

        </div>

      </article>

    </section>

    <section class="secao">

      <h2>Tabela de Tokens</h2>

      <table class="tabela">

        <thead>
          <tr>
            <th>Cor</th>
            <th>Nome</th>
            <th>Valor</th>
          </tr>
        </thead>

        <tbody>

          <tr>
            <td style="background-color: #6c5ce7;"></td>
            <td>Primária</td>
            <td>#6c5ce7</td>
          </tr>

          <tr>
            <td style="background-color: #00cec9;"></td>
            <td>Secundária</td>
            <td>#00cec9</td>
          </tr>

          <tr>
            <td style="background-color: #fdcb6e;"></td>
            <td>Destaque</td>
            <td>#fdcb6e</td>
          </tr>

          <tr>
            <td style="background-color: #00b894;"></td>
            <td>Sucesso</td>
            <td>#00b894</td>
          </tr>

          <tr>
            <td style="background-color: #d63031;"></td>
            <td>Erro</td>
            <td>#d63031</td>
          </tr>

        </tbody>

      </table>

    </section>

    <section class="secao">

      <h2>Formulário</h2>

      <form class="form">

        <div class="form__grupo">

          <label class="form__label" for="nome">
            Nome
          </label>

          <input
            class="form__input"
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            required
          />

        </div>

        <div class="form__grupo">

          <label class="form__label" for="email">
            E-mail
          </label>

          <input
            class="form__input"
            type="email"
            id="email"
            placeholder="usuario@email.com"
            required
          />

        </div>

        <div class="form__grupo">

          <label class="form__label" for="senha">
            Senha
          </label>

          <input
            class="form__input"
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            required
          />

        </div>

        <div class="form__grupo">

          <label class="form__label" for="mensagem">
            Mensagem
          </label>

          <textarea
            class="form__input"
            id="mensagem"
            placeholder="Digite sua mensagem"
          ></textarea>

        </div>

        <button class="btn btn--primario form__botao">
          Enviar
        </button>

      </form>

    </section>

  </main>

</body>
</html>
