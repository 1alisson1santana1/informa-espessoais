
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWEB1 — Cap. 07 — AT01 — Cartão de Apresentação</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #eaf0f6;
      text-align: center;
      margin: 0;
      padding: 2rem 1rem;
    }

    main {
      max-width: 450px; /* Largura máxima ideal para um cartão de visitas */
      margin: 2rem auto; /* Centraliza na tela e adiciona margem acima/abaixo */
    }

    .cartao {
      background-color: #ffffff;
      border-radius: 16px; /* Bordas arredondadas suaves */
      padding: 2.5rem 2rem; /* Espaçamento interno confortável */
      box-shadow: 0 4px 12px rgba(18, 51, 84, 0.08); /* Sombra leve para dar profundidade */
    }

    .cartao-nome {
      font-size: 2rem;
      color: #123354;
      margin-top: 0;
      margin-bottom: 1rem;
    }

    /* Estilização moderna e unificada para a linha divisória */
    .cartao-divisor {
      border: 0;
      border-top: 2px dashed #cbd5e1; /* Linha tracejada em tom cinza claro */
      margin: 1.5rem 0;
    }

    .cartao-cargo {
      font-style: italic;
      color: #4a6b82; /* Tom ligeiramente diferente para criar hierarquia visual */
      font-size: 1.1rem;
      font-weight: 500;
    }

    .cartao-email {
      font-size: 0.9rem;
      color: #123354;
      margin: 0.5rem 0;
    }

    .cartao-telefone {
      font-size: 0.9rem;
      color: #123354;
      font-weight: bold; /* Destaca o telefone */
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>AT01 - Cartão de Apresentação</h1>
    <p><a href="../index.html">← Voltar para a página principal</a></p>
  </header>

  <main>
    <article class="cartao">
        <h1 class="cartao-nome">Alisson Witor da Silva Santana</h1> 
        
        <p class="cartao-cargo">Estudante de Sistemas de Informação - IFAL</p>
        
        <hr class="cartao-divisor">
        
        <p class="cartao-email"><strong>E-mail:</strong> alissonwitor01@gmail.com</p>
        <p class="cartao-email"><strong>Institucional:</strong> awss3@aluno.ifal.edu.br</p>
        
        <hr class="cartao-divisor">
        
        <p class="cartao-telefone">📞 (82) 933009505</p>
    </article>
  </main>

</body>
</html>
