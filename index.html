<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Escola Técnica</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <form id="formInscricao" novalidate>
            <fieldset>
                <legend>Formulário de Inscrição</legend>

                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Digite seu nome completo">
                    <span class="error-message" id="error-nome"></span>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
                    <span class="error-message" id="error-email"></span>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="(82) 99999-9999" maxlength="15">
                    <span class="error-message" id="error-telefone"></span>
                </div>

                <div class="form-group">
                    <label for="dataNascimento">Data de Nascimento:</label>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>
                    <span class="error-message" id="error-dataNascimento"></span>
                </div>

                <div class="form-group">
                    <label for="curso">Curso:</label>
                    <select id="curso" name="curso" required>
                        <option value="" disabled selected>Selecione um curso</option>
                        <option value="informatica">Técnico em Informática</option>
                        <option value="eletronica">Técnico em Eletrônica</option>
                        <option value="quimica">Técnico em Química</option>
                    </select>
                    <span class="error-message" id="error-curso"></span>
                </div>

                <div class="form-group">
                    <label>Turno:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="turno" value="matutino" required> Matutino</label>
                        <label><input type="radio" name="turno" value="vespertino"> Vespertino</label>
                        <label><input type="radio" name="turno" value="noturno"> Noturno</label>
                    </div>
                    <span class="error-message" id="error-turno"></span>
                </div>

                <div class="form-group">
                    <label>Áreas de Interesse (Selecione pelo menos 2):</label>
                    <div class="checkbox-group" id="areasInteresseGroup">
                        <label><input type="checkbox" name="areas" value="programacao"> Programação</label>
                        <label><input type="checkbox" name="areas" value="redes"> Redes de Computadores</label>
                        <label><input type="checkbox" name="areas" value="hardware"> Hardware</label>
                        <label><input type="checkbox" name="areas" value="design"> UI/UX Design</label>
                    </div>
                    <span class="error-message" id="error-areas"></span>
                </div>

                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <div class="password-container">
                        <input type="password" id="senha" name="senha" required placeholder="Mínimo 8 caracteres">
                        <button type="button" class="btn-toggle-password" id="toggleSenha">👁️</button>
                    </div>
                    <span class="error-message" id="error-senha"></span>
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">Confirmar Senha:</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" required placeholder="Repita a senha">
                    <span class="error-message" id="error-confirmarSenha"></span>
                </div>

                <div class="form-group">
                    <label for="foto">Foto de Perfil (Opcional - JpG/PnG max 2MB):</label>
                    <input type="file" id="foto" name="foto" accept="image/png, image/jpeg">
                    <span class="error-message" id="error-foto"></span>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem de Motivação:</label>
                    <textarea id="mensagem" name="mensagem" required minlength="50" maxlength="500" placeholder="Escreva de 50 a 500 caracteres..."></textarea>
                    <div class="char-counter"><span id="charCount">0</span>/500</div>
                    <span class="error-message" id="error-mensagem"></span>
                </div>

                <div class="form-group checkbox-single">
                    <label><input type="checkbox" id="termos" name="termos" required> Aceito os termos e condições</label>
                    <span class="error-message" id="error-termos"></span>
                </div>

                <div class="btn-group">
                    <button type="submit" id="btnEnviar">Enviar</button>
                    <button type="reset" id="btnLimpar">Limpar</button>
                </div>
            </fieldset>
        </form>
    </div>

    <script src="js/util.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
